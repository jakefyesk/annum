name: build & deploy

# No schedule. Every day of the year is rendered ahead of time and the phone
# picks today's file, so there is nothing for a cron job to keep up to date.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Second line of defence: the pre-commit hook can be bypassed, this cannot.
      - name: Guard against personal data in the repo
        run: npm run guard

      - name: Build
        env:
          # A variable, not a secret, so it can be read back and edited
          # conversationally. Its contents are largely inferable from the
          # published wallpaper anyway — see README → Privacy.
          #
          # But variables are NOT masked in logs the way secrets are, and this
          # repo's logs are public, so the base64 is load-bearing here: it is
          # what stands between a stray trace and a readable calendar. Never
          # echo it, and never turn on shell tracing in this job.
          ANNUM_CONFIG: ${{ vars.ANNUM_CONFIG }}
          # The slug stays a secret. It is the only thing keeping the
          # wallpapers off a guessable URL, so it must be masked.
          ANNUM_SLUG: ${{ secrets.ANNUM_SLUG }}
        run: npm run build

      - name: Check nothing personal leaked into the payload
        run: node scripts/verify-dist.mjs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
