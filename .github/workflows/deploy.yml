name: build & deploy

# No schedule. Every day of the year is rendered ahead of time and the phone
# picks today's file, so there is nothing for a cron job to keep up to date.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read   # to read the ANNUM_CONFIG variable at runtime

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Second line of defence: the pre-commit hook can be bypassed, this cannot.
      - name: Guard against personal data in the repo
        run: npm run guard

      # Fetched at runtime, never interpolated into the workflow. Anything
      # passed through a step's `env:` or `run:` is printed verbatim in the log
      # by the runner itself, and this repo's logs are public — a variable is
      # not masked the way a secret is. add-mask covers it for everything after.
      - name: Load config
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          value=$(gh api "repos/$GITHUB_REPOSITORY/actions/variables/ANNUM_CONFIG" --jq .value 2>/dev/null || true)
          if [ -z "$value" ]; then
            echo "ANNUM_CONFIG variable not set or unreadable; falling back to the example"
          else
            echo "::add-mask::$value"
            echo "ANNUM_CONFIG=$value" >> "$GITHUB_ENV"
            echo "loaded config ($(printf %s "$value" | wc -c) bytes, masked)"
          fi

      - name: Build
        env:
          # The slug is a secret, so the runner masks it in the env block.
          ANNUM_SLUG: ${{ secrets.ANNUM_SLUG }}
        run: npm run build

      - name: Check nothing personal leaked into the payload
        run: node scripts/verify-dist.mjs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
